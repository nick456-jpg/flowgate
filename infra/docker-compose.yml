name: flowgate

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
      POSTGRES_DB: flowgate
    ports:
      - "${FLOWGATE_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate -d flowgate"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FLOWGATE_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment: &app-env
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://flowgate:flowgate@postgres:5432/flowgate?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-characters-min}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-7c257913e72c365e085b7c3d4f1b0c25ba1d30f2bf949b5cce76e2b20a2da8a1}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      LLM_MOCK: ${LLM_MOCK:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      RUNTIME_ROLE: http
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma && node_modules/.bin/tsx apps/api/prisma/seed.ts && node apps/api/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FLOWGATE_API_PORT:-3001}:3000"

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      <<: *app-env
      RUNTIME_ROLE: worker
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
